name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify tag matches package version
        run: |
          PKG_VERSION="v$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [[ "${GITHUB_REF_NAME}" != "${PKG_VERSION}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${PKG_VERSION}" >&2
            exit 1
          fi
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Pick release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="docs/RELEASE_NOTES_v${VERSION}.md"
          if [[ -f "${NOTES}" ]]; then
            echo "body_path=${NOTES}" >> "$GITHUB_OUTPUT"
          else
            echo "body_path=CHANGELOG.md" >> "$GITHUB_OUTPUT"
          fi
        id: notes
      - uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.notes.outputs.body_path }}
          files: |
            dist/*
